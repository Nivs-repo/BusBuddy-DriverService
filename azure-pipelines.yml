# =========================
# Azure DevOps Pipeline for Commuter Service
# =========================

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  javaVersion: '17'
  artifactName: 'commuter-service'
  buildDir: '$(System.DefaultWorkingDirectory)/target'

steps:
  # 1️⃣ Checkout code
  - task: Checkout@1

  # 2️⃣ Setup JDK
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '$(javaVersion)'
      jdkArchitecture: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 3️⃣ Cache Maven dependencies
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: ~/.m2/repository

  # 4️⃣ Build with Maven
  - task: Maven@3
    displayName: 'Build with Maven'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean package -DskipTests'

  # 5️⃣ Publish build artifact
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(buildDir)'
      ArtifactName: '$(artifactName)'
      publishLocation: 'Container'

# =========================
# Deployment Stage
# =========================
stages:
- stage: DeployToAzure
  displayName: 'Deploy Commuter Service'
  dependsOn: []
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))  # only on main branch
  jobs:
    - job: Deploy
      displayName: 'Deploy to Azure App Service'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: '$(artifactName)'
            downloadPath: '$(System.DefaultWorkingDirectory)'

        - task: AzureWebApp@1
          displayName: 'Deploy to Azure App Service'
          inputs:
            azureSubscription: '<your-service-connection>'
            appName: '<your-app-service-name>'
            package: '$(System.DefaultWorkingDirectory)/$(artifactName)/*.jar'
